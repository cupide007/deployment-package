<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; img-src 'self' data: blob: https:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; font-src 'self' https: data:;">
    <title>安提斯特国家图书馆 - 安提斯特虚拟国</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4bb.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="retinbox-config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2463',
                        secondary: '#E6AF2E',
                        accent: '#3E92CC',
                        light: '#FFFAFF',
                        dark: '#1E1B18',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
<nav id="main-nav" class="bg-primary text-light shadow-lg fixed w-full z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold">安提斯特虚拟国</span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="welcome-user" class="hidden">欢迎，<span id="current-username"></span></span>
            <button id="logout-btn" class="bg-gray-700 text-light px-4 py-2 rounded-md hover:bg-gray-600 font-medium">出国</button>
        </div>
    </div>
</nav>

<main class="pt-16">
    <section class="bg-primary py-12 text-light text-center">
        <h1 class="text-4xl font-bold mb-4">国家图书馆</h1>
        <p class="text-xl mb-6">珍贵史料与知识的殿堂</p>
        <div class="flex justify-center gap-4">
            <button id="upload-docs-btn" class="bg-secondary text-primary px-6 py-3 rounded-md font-bold">上传文献</button>
        </div>
    </section>

    <section class="py-8 bg-white shadow-md sticky top-16 z-40">
        <div class="container mx-auto px-4 flex gap-4">
            <input type="text" id="search-input" class="flex-grow px-4 py-2 border rounded-md" placeholder="搜索文献...">
            <button id="search-btn" class="bg-primary text-white px-6 py-2 rounded-md">搜索</button>
        </div>
    </section>

    <section class="py-12 bg-gray-50">
        <div class="container mx-auto px-4">
            <div id="documents-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </div>
    </section>
</main>

<div id="document-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-y-auto p-6 relative">
        <button id="close-document-modal" class="absolute top-4 right-4 text-2xl text-gray-500">&times;</button>
        <h2 id="document-detail-title" class="text-2xl font-bold text-primary mb-4"></h2>
        <div class="grid grid-cols-2 gap-4 text-sm text-gray-600 mb-6">
            <p>作者：<span id="document-detail-author"></span></p>
            <p>分类：<span id="document-detail-category"></span></p>
            <p>上传者：<span id="document-detail-uploader"></span></p>
            <p>日期：<span id="document-detail-date"></span></p>
        </div>
        <div class="bg-gray-50 p-4 rounded-lg mb-6">
            <h4 class="font-bold mb-2">摘要</h4>
            <p id="document-detail-description"></p>
        </div>
        <div class="flex gap-4">
            <button id="download-document-btn" class="bg-primary text-white px-6 py-2 rounded-md flex items-center gap-2">
                <i class="fa fa-download"></i> 下载
            </button>
            <button id="view-document-btn" class="bg-secondary text-primary px-6 py-2 rounded-md flex items-center gap-2">
                <i class="fa fa-eye"></i> 在线阅读
            </button>
        </div>
    </div>
</div>

<div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 p-6">
        <h2 class="text-xl font-bold mb-4">上传文献</h2>
        <form id="upload-form" class="space-y-4">
            <input type="text" id="document-title" placeholder="标题" class="w-full border p-2 rounded" required>
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="document-author" placeholder="作者" class="w-full border p-2 rounded" required>
                <select id="document-category" class="w-full border p-2 rounded" required>
                    <option value="其他">其他</option>
                    <option value="法律">法律</option>
                    <option value="历史">历史</option>
                    <option value="经济">经济</option>
                    <option value="文化">文化</option>
                    <option value="政治">政治</option>
                    <option value="科技">科技</option>
                    <option value="教育">教育</option>
                </select>
            </div>
            <textarea id="document-description" rows="3" placeholder="摘要" class="w-full border p-2 rounded" required></textarea>
            <input type="file" id="document-file" class="w-full border p-2 rounded" required>
            <div class="flex justify-end gap-4 mt-4">
                <button type="button" id="close-upload-modal" class="px-4 py-2 border rounded text-gray-600">取消</button>
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded">上传</button>
            </div>
        </form>
    </div>
</div>

<script src="init-data.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        checkLoginStatus();
        let documentsData = [];
        try {
            if (window.safeGetData) {
                const res = await window.safeGetData('documents', []);
                documentsData = Array.isArray(res) ? res : (res.documents || []);
            } else {
                documentsData = JSON.parse(localStorage.getItem('documents') || '[]');
            }
        } catch(e) { console.error(e); }

        const container = document.getElementById('documents-container');
        function renderDocs() {
            container.innerHTML = '';
            const list = [...documentsData].reverse();
            if (list.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">暂无文献</div>';
                return;
            }
            list.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-lg shadow hover:shadow-lg transition';
                div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold text-primary truncate w-3/4">${doc.title}</h3>
                            <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">${doc.category}</span>
                        </div>
                        <p class="text-sm text-gray-500 mb-4">作者：${doc.author}</p>
                        <p class="text-gray-600 text-sm line-clamp-2 mb-4 h-10">${doc.description}</p>
                        <button class="w-full bg-primary text-white py-2 rounded hover:bg-opacity-90 view-btn" data-id="${doc.id}">查看详情</button>
                    `;
                container.appendChild(div);
            });
            document.querySelectorAll('.view-btn').forEach(btn => btn.onclick = () => showDetails(btn.dataset.id));
        }
        renderDocs();

        const modal = document.getElementById('document-modal');

        function getAbsoluteUrl(url) {
            if (!url) return '';
            try {
                return new URL(url, window.location.href).href;
            } catch (e) {
                return url;
            }
        }

        function getFileExtension(fileUrl) {
            if (!fileUrl) return '.pdf';
            try {
                const u = new URL(fileUrl, window.location.href);
                const nameParam = u.searchParams.get('name');
                if (nameParam) {
                    const parts = nameParam.split('.');
                    if (parts.length > 1) return '.' + parts.pop().toLowerCase();
                }
                if (fileUrl.startsWith('data:')) {
                    return '.pdf';
                }
            } catch(e) {}
            return '.pdf';
        }

        function showDetails(id) {
            const doc = documentsData.find(d => d.id === id);
            if (!doc) return;

            document.getElementById('document-detail-title').textContent = doc.title;
            document.getElementById('document-detail-author').textContent = doc.author;
            document.getElementById('document-detail-category').textContent = doc.category;
            document.getElementById('document-detail-uploader').textContent = doc.uploaderName || '未知';
            document.getElementById('document-detail-date').textContent = new Date(doc.uploadDate).toLocaleDateString();
            document.getElementById('document-detail-description').textContent = doc.description;

            const absUrl = getAbsoluteUrl(doc.fileUrl);
            const extension = getFileExtension(doc.fileUrl);

            const downloadBtn = document.getElementById('download-document-btn');
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = absUrl;
                const name = new URL(absUrl).searchParams.get('name') || (doc.title + extension);
                link.download = name;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const viewBtn = document.getElementById('view-document-btn');
            viewBtn.onclick = async () => {
                if (['.txt', '.md'].includes(extension)) {
                    try {
                        const res = await fetch(absUrl);
                        const text = await res.text();
                        const w = window.open('', '_blank');
                        w.document.write(`<pre style="padding:20px;white-space:pre-wrap;font-family:monospace">${text}</pre>`);
                    } catch(e) { alert('读取失败'); }
                }
                else if (['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(extension)) {
                    window.open(absUrl, '_blank');
                }
                else if (extension === '.pdf') {
                    window.open(absUrl, '_blank');
                }
                else if (['.doc','.docx','.xls','.xlsx','.ppt','.pptx'].includes(extension)) {
                    // 微软预览服务
                    window.open(`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(absUrl)}`, '_blank');
                }
                else {
                    // 其他格式尝试直接打开（浏览器可能会触发下载）
                    window.open(absUrl, '_blank');
                }
            };

            modal.classList.remove('hidden');
        }

        document.getElementById('close-document-modal').onclick = () => modal.classList.add('hidden');
        const uploadModal = document.getElementById('upload-modal');
        document.getElementById('upload-docs-btn').onclick = () => uploadModal.classList.remove('hidden');
        document.getElementById('close-upload-modal').onclick = () => uploadModal.classList.add('hidden');

        document.getElementById('upload-form').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('document-file').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('document', file);

            try {
                const res = await fetch('upload-document.php', { method: 'POST', body: formData });
                const json = await res.json();
                if (!res.ok) throw new Error(json.message || json.error || '上传失败');

                const newDoc = {
                    id: Date.now().toString(),
                    title: document.getElementById('document-title').value,
                    author: document.getElementById('document-author').value,
                    category: document.getElementById('document-category').value,
                    description: document.getElementById('document-description').value,
                    fileUrl: json.url,
                    uploaderName: JSON.parse(sessionStorage.getItem('currentUser')||'{}').username || 'Guest',
                    uploadDate: new Date().toISOString(),
                    approved: true
                };
                documentsData.push(newDoc);
                if (window.safeSaveData) await window.safeSaveData('documents', documentsData);
                else localStorage.setItem('documents', JSON.stringify(documentsData));
                renderDocs();
                uploadModal.classList.add('hidden');
                alert('上传成功！');
                document.getElementById('upload-form').reset();
            } catch (e) {
                alert('上传失败: ' + e.message);
            }
        };

        function checkLoginStatus() {
            const u = JSON.parse(sessionStorage.getItem('currentUser'));
            if (!u) window.location.href = 'index.html';
            document.getElementById('welcome-user').classList.remove('hidden');
            document.getElementById('current-username').textContent = u.username;
            document.getElementById('logout-btn').onclick = () => {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            };
        }
    });
</script>
</body>
</html>
