<!DOCTYPE html>

    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        /* 定义主题颜色变量 */
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #f3f4f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --light-color: #f3f4f6;
            --dark-color: #1f2937;
            --gray-color: #6b7280;
        }
        
        /* 自定义主题颜色类 */
        .text-primary { color: var(--primary-color); }
        .bg-primary { background-color: var(--primary-color); }
        .bg-primary-90 { background-color: rgba(59, 130, 246, 0.9); }
        .text-secondary { color: var(--secondary-color); }
        .bg-secondary { background-color: var(--secondary-color); }
        .bg-secondary-90 { background-color: rgba(243, 244, 246, 0.9); }
        
        /* 加载状态样式 */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .loading::after {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 8px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 结果容器样式 */
        .result-container {
            transition: all 0.3s ease;
        }
        
        /* 错误状态样式 */
        .error {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        /* 成功状态样式 */
        .success {
            color: var(--success-color);
            border-color: var(--success-color);
        }
        
        /* 焦点样式 */
        button:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
        
        /* 按钮过渡效果 */
        button {
            transition: all 0.2s ease;
        }
        
        /* 响应式设计优化 */
        @media (max-width: 640px) {
            .grid-cols-1 {
                grid-template-columns: 1fr;
            }
            
            .md\:grid-cols-2 {
                grid-template-columns: 1fr;
            }
            
            .md\:grid-cols-3 {
                grid-template-columns: 1fr;
            }
            
            .md\:col-span-2 {
                grid-column: span 1;
            }
        }
        
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .test-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .test-failure {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .test-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
    <!-- Retinbox 配置 -->
    <script src="retinbox-config.js"></script>
    <!-- 统一的数据初始化脚本 -->

    <script>
        // 辅助函数：显示结果
        function showResult(elementId, result) {
            const element = document.getElementById(elementId);
            // 添加成功或错误类
            element.className = 'mt-4 p-4 bg-gray-50 rounded border border-gray-200 result-container';
            if (result.success) {
                element.classList.add('success');
            } else {
                element.classList.add('error');
            }
            // 显示结果
            element.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        }
        
        // 辅助函数：显示加载状态
        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.disabled = true;
            element.classList.add('loading');
        }
        
        // 辅助函数：隐藏加载状态
        function hideLoading(elementId) {
            const element = document.getElementById(elementId);
            element.disabled = false;
            element.classList.remove('loading');
        }
        
        // 辅助函数：清除结果
        function clearResult(elementId) {
            const element = document.getElementById(elementId);

            } catch (error) {
                logValidationResult(`登录失败: ${error.message}`, 'failure');
                logValidationResult(`错误详情: ${JSON.stringify(error)}`, 'failure');
            }
        });
        
        // 登录验证测试相关事件
        document.getElementById('run-auto-tests').addEventListener('click', async () => {
            clearValidationResults();
            logValidationResult('开始运行自动测试...', 'info');
            
            // 初始化测试数据
            if (!localStorage.getItem('users')) {
                const initialUsers = [
                    {
                        id: '1',
                        username: 'admin',
                        email: 'admin@antister.com',
                        password: 'admin',
                        qq: '123456789',
                        role: 'admin',
                        createdAt: new Date().toISOString(),
                        lastLogin: null
                    },
                    {
                        id: '2',
                        username: 'user1',
                        email: 'user1@antister.com',
                        password: 'password123',
                        qq: '987654321',
                        role: 'user',
                        createdAt: new Date().toISOString(),
                        lastLogin: null
                    }
                ];
                localStorage.setItem('users', JSON.stringify(initialUsers));
                logValidationResult('测试数据已初始化', 'info');
            }
            
            // 测试场景1: 使用正确的管理员凭据登录
            await testLoginScenario('admin', 'admin', 'success', '使用正确的管理员用户名和密码登录');
            
            // 测试场景2: 使用管理员邮箱和正确密码登录
            await testLoginScenario('admin@antister.com', 'admin', 'success', '使用管理员邮箱和正确密码登录');
            
            // 测试场景3: 使用正确的普通用户凭据登录
            await testLoginScenario('user1', 'password123', 'success', '使用正确的普通用户用户名和密码登录');
            
            // 测试场景4: 使用普通用户邮箱和正确密码登录
            await testLoginScenario('user1@antister.com', 'password123', 'success', '使用普通用户邮箱和正确密码登录');
            
            // 测试场景5: 使用错误的密码登录
            await testLoginScenario('admin', 'wrongpassword', 'failure', '使用错误的密码登录管理员账户');
            
            // 测试场景6: 使用不存在的用户名登录
            await testLoginScenario('nonexistentuser', 'password123', 'failure', '使用不存在的用户名登录');
            
            logValidationResult('所有自动测试已完成!', 'info');
            updateCurrentUserInfo();
        });
        
        // 测试登录场景辅助函数
        async function testLoginScenario(username, password, expectedResult, description) {
            logValidationResult(`开始测试: ${description}`, 'info');
            
            try {
                await logout(); // 确保先退出登录
                
                const userCredential = await firebaseAuth.signInWithEmailAndPassword(username, password);
                const user = userCredential.user;
                
                if (expectedResult === 'success') {
                    logValidationResult(`测试通过: ${description}`, 'success');
                    logValidationResult(`  - 用户ID: ${user.uid}`, 'success');
                    logValidationResult(`  - 邮箱: ${user.email}`, 'success');
                } else {
                    logValidationResult(`测试失败: ${description} - 预期失败但实际成功`, 'failure');
                }
                
                await logout(); // 测试完成后退出登录
            } catch (error) {
                if (expectedResult === 'failure') {
                    logValidationResult(`测试通过: ${description} - 预期失败，实际失败: ${error.message}`, 'success');
                } else {
                    logValidationResult(`测试失败: ${description} - 预期成功但实际失败: ${error.message}`, 'failure');
                    logValidationResult(`  - 错误详情: ${JSON.stringify(error)}`, 'failure');
                }
            }
        }
        
        document.getElementById('clear-storage').addEventListener('click', clearLocalStorage);
        document.getElementById('show-users').addEventListener('click', showUsers);
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateCurrentUserInfo();
            logValidationResult('页面加载完成，开始测试...', 'info');
            showUsers();
        });
    </script>
</body>
</html>
