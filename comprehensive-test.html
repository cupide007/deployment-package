<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Retinbox PHP 系统完整性测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="retinbox-config.js"></script>
</head>
<body class="bg-gray-100 p-10">
<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Retinbox PHP 系统自检程序</h1>

    <div class="mb-6 flex gap-4">
        <button onclick="startTests()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
            开始全面测试 (安全模式)
        </button>
        <button onclick="clearConsole()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition">
            清空日志
        </button>
    </div>

    <div id="progress-container" class="w-full bg-gray-200 rounded-full h-2.5 mb-6 hidden">
        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
    </div>

    <div class="space-y-4">
        <div class="border rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">模块</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">测试项</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">耗时</th>
                </tr>
                </thead>
                <tbody id="test-results" class="bg-white divide-y divide-gray-200">
                </tbody>
            </table>
        </div>

        <div class="bg-black text-green-400 p-4 rounded font-mono text-sm h-64 overflow-y-auto" id="console-output">
            > 准备就绪，请点击开始测试。
        </div>
    </div>
</div>

<script>
    const log = (msg, type = 'info') => {
        const consoleDiv = document.getElementById('console-output');
        const color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : 'text-gray-300');
        consoleDiv.innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    };

    const addResult = (module, item, success, time) => {
        const tbody = document.getElementById('test-results');
        const row = document.createElement('tr');
        row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${module}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                        ${success ? '通过' : '失败'}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${time}ms</td>
            `;
        tbody.appendChild(row);
    };

    const clearConsole = () => {
        document.getElementById('console-output').innerHTML = '> 日志已清空...';
        document.getElementById('test-results').innerHTML = '';
    };

    async function startTests() {
        clearConsole();
        document.getElementById('progress-container').classList.remove('hidden');
        const tests = [
            testInit,
            testRegister,
            testLogin,
            testBankCreate,
            testBankTransaction,
            testLibraryAdd,
            testSettingsUpdate,
            testFileUpload
        ];

        let passed = 0;
        const rand = Math.floor(Math.random() * 10000);
        const testEmail = `test_${rand}@example.com`;
        const testUser = `tester_${rand}`;
        const testPass = 'password123';
        let testContext = { email: testEmail, username: testUser, password: testPass };

        log('开始测试 (间隔 5秒 以防止 429 错误)...');

        for (let i = 0; i < tests.length; i++) {
            const percent = ((i) / tests.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            try {
                await tests[i](testContext);
                passed++;
            } catch (e) {
                log(`测试失败: ${e.message}`, 'error');
            }

            await new Promise(r => setTimeout(r, 5000));
        }

        document.getElementById('progress-bar').style.width = '100%';
        log(`测试完成! 通过: ${passed}/${tests.length}`, passed === tests.length ? 'success' : 'error');
    }

    async function testInit(ctx) {
        const start = Date.now();
        try {
            const res = await window.retinbox.request('init', 'POST');
            log('初始化: ' + (res.success ? '成功' : res.message));
            addResult('系统', '数据库初始化', true, Date.now() - start);
        } catch (e) {
            if (e.message && e.message.includes('数据库已初始化')) {
                log('数据库已存在，跳过');
                addResult('系统', '数据库初始化 (已存在)', true, Date.now() - start);
            } else {
                addResult('系统', '数据库初始化', false, Date.now() - start);
                throw e;
            }
        }
    }

    async function testRegister(ctx) {
        const start = Date.now();
        try {
            const res = await window.retinbox.register(ctx.email, ctx.password, ctx.username);
            log(`注册成功: UserID=${res.user.id}`);
            addResult('认证', '用户注册', true, Date.now() - start);
        } catch (e) {
            addResult('认证', '用户注册', false, Date.now() - start);
            throw e;
        }
    }

    async function testLogin(ctx) {
        const start = Date.now();
        try {
            await window.retinbox.login(ctx.email, ctx.password);
            log(`登录成功`);
            addResult('认证', '用户登录', true, Date.now() - start);
        } catch (e) {
            addResult('认证', '用户登录', false, Date.now() - start);
            throw e;
        }
    }

    async function testBankCreate(ctx) {
        const start = Date.now();
        try {
            await window.retinbox.createBankAccount();
            log(`开户成功`);
            addResult('银行', '创建账户', true, Date.now() - start);
        } catch (e) {
            if (e.message && e.message.includes('已存在')) {
                addResult('银行', '创建账户 (已存在)', true, Date.now() - start);
            } else {
                addResult('银行', '创建账户', false, Date.now() - start);
                throw e;
            }
        }
    }

    async function testBankTransaction(ctx) {
        const start = Date.now();
        try {
            await window.retinbox.addTransaction(100, 'income', '测试收入');
            addResult('银行', '交易测试', true, Date.now() - start);
        } catch (e) {
            addResult('银行', '交易测试', false, Date.now() - start);
            throw e;
        }
    }

    async function testLibraryAdd(ctx) {
        const start = Date.now();
        try {
            await window.retinbox.addLibraryRecord('bk_test_1', '测试图书');
            addResult('图书馆', '借阅图书', true, Date.now() - start);
        } catch (e) {
            addResult('图书馆', '借阅图书', false, Date.now() - start);
            throw e;
        }
    }

    async function testSettingsUpdate(ctx) {
        const start = Date.now();
        try {
            await window.retinbox.updateUserSettings({ theme: 'dark' });
            addResult('设置', '更新设置', true, Date.now() - start);
        } catch (e) {
            addResult('设置', '更新设置', false, Date.now() - start);
            throw e;
        }
    }

    async function testFileUpload(ctx) {
        const start = Date.now();
        try {
            const blob = new Blob(["Hello World"], { type: "text/plain" });
            const formData = new FormData();
            formData.append("document", blob, "test_doc.txt");

            const res = await window.retinbox.uploadDocument(formData);
            log(`上传成功: ID=${res.document.id}`);
            addResult('上传', '文档上传', true, Date.now() - start);
        } catch (e) {
            log('上传失败: ' + e.message, 'error');
            addResult('上传', '文档上传', false, Date.now() - start);
        }
    }
</script>
</body>
</html>
